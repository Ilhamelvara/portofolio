<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#151D2E" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="450" fill="url(#bg)" />
  <circle cx="200" cy="180" r="130" fill="url(#accentGrad)" />
  
  <!-- Silhouette Body -->
  <path d="M70 410 C70 310, 140 270, 200 270 C260 270, 330 310, 330 410 Z" fill="#1E293B" />
  
  <!-- Silhouette Head -->
  <circle cx="200" cy="180" r="65" fill="#334155" />
  
  <!-- Developer Monogram Badge -->
  <rect x="155" y="145" width="90" height="70" rx="16" fill="#0B0F19" stroke="url(#primaryGrad)" stroke-width="2.5" />
  <text x="200" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="2">MI</text>
  
  <!-- Subtle Glasses / Tech Element -->
  <rect x="165" y="115" width="28" height="14" rx="4" fill="none" stroke="#6366F1" stroke-width="2.5" />
  <rect x="207" y="115" width="28" height="14" rx="4" fill="none" stroke="#6366F1" stroke-width="2.5" />
  <line x1="193" y1="122" x2="207" y2="122" stroke="#6366F1" stroke-width="2.5" />
  
  <!-- Bottom Tag -->
  <rect x="90" y="365" width="220" height="32" rx="16" fill="#0F172A" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="200" y="386" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Mohammad Ilham Putra Irawan</text>
</svg>
